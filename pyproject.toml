[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "researchgpt-pipeline-v2"
version = "0.1.0"
description = "Provenance-preserving scientific evidence pipeline"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.7,<3", "fastapi>=0.110,<1", "uvicorn>=0.29,<1", "requests>=2.31,<3", "PyMuPDF>=1.24,<2", "PyYAML>=6,<7", "tqdm>=4.66,<5"]

[project.optional-dependencies]
retrieval = ["chromadb>=1.1,<2", "sentence-transformers>=5.1,<6", "numpy>=1.26,<3"]
hybrid = ["rank-bm25>=0.2.2,<0.3"]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["shared*", "pipeline*", "src*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"
markers = ["contract: schema and interface checks", "unit: isolated deterministic functions", "integration: connected real modules", "e2e: actual document with configured model and index", "live: optional external or local model resources"]
